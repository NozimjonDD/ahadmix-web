# =============================================================================
# Nginx configuration for ahadmix.uz
# Place at: /etc/nginx/sites-available/ahadmix
# Enable:   ln -s /etc/nginx/sites-available/ahadmix /etc/nginx/sites-enabled/
# =============================================================================

# Redirect all HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name ahadmix.uz www.ahadmix.uz;

    return 301 https://$host$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ahadmix.uz www.ahadmix.uz;

    # -------------------------------------------------------------------------
    # SSL (managed by Certbot)
    # -------------------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/ahadmix.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ahadmix.uz/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # -------------------------------------------------------------------------
    # Gzip compression
    # -------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        image/svg+xml;

    # -------------------------------------------------------------------------
    # Security headers
    # -------------------------------------------------------------------------
    add_header X-Frame-Options             "DENY"                              always;
    add_header X-Content-Type-Options      "nosniff"                           always;
    add_header X-XSS-Protection            "1; mode=block"                     always;
    add_header Referrer-Policy             "strict-origin-when-cross-origin"   always;

    # -------------------------------------------------------------------------
    # General
    # -------------------------------------------------------------------------
    client_max_body_size 50m;

    # -------------------------------------------------------------------------
    # Static files
    # -------------------------------------------------------------------------
    location /static/ {
        alias   /var/local/ahadmix/ahadmix-web/static/;
        expires 30d;
        add_header Cache-Control public;
    }

    location /media/ {
        alias   /var/local/ahadmix/ahadmix-web/media/;
        expires 7d;
    }

    location /assets/ {
        alias   /var/local/ahadmix/ahadmix-web/templates/assets/;
        expires 30d;
        add_header Cache-Control public;
    }

    # Deny direct access to backups and admin config
    location ^~ /data/backups/ {
        deny all;
        return 404;
    }

    location = /admin/config.php {
        deny all;
        return 404;
    }

    location /data/ {
        alias   /var/local/ahadmix/ahadmix-web/templates/data/;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /docs/ {
        alias   /var/local/ahadmix/ahadmix-web/docs/;
        expires 30d;
        add_header Cache-Control public;
    }

    # -------------------------------------------------------------------------
    # Application (Gunicorn via HTTP port 8002)
    # -------------------------------------------------------------------------
    location / {
        proxy_pass          http://127.0.0.1:8002;
        proxy_set_header    Host              $http_host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_redirect      off;
        proxy_read_timeout  300s;
        proxy_connect_timeout 75s;
    }
}
